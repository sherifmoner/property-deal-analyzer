services:
  - type: web
    name: property-deal-analyzer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PDA_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
