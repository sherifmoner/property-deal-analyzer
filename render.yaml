services:
  - type: web
    name: property-deal-analyzer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PDA_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PDA_PASSWORD   # set a value in the Render dashboard to lock the app behind a login
        sync: false
      - key: PDA_USER
        value: admin
      - key: PDA_SECRET
        generateValue: true
